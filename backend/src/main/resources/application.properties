server.port=${PORT:8080}

# ---------- H2 database (works without installing anything) ----------
# Override with DB_URL / DB_USERNAME / DB_PASSWORD env vars (e.g. a MySQL or Postgres URL) in production
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fooddb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE:true}

# ---------- To use MySQL instead, set DB_URL like this ----------
# DB_URL=jdbc:mysql://localhost:3306/fooddb?createDatabaseIfNotExist=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------- CORS ----------
# Comma-separated list of frontend URLs allowed to call the API
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---------- JWT ----------
# Secret must be at least 32 characters long. Set JWT_SECRET in production!
jwt.secret=${JWT_SECRET:my-super-secret-key-for-food-app-1234567890}
# 1 day in milliseconds
jwt.expiration=86400000
